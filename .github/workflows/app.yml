name: app
# Fold2 AI (android-app/): APK -> релиз app-N (fold2-ai.apk + sha256)
on:
  push:
    branches: [main, app]
    paths: ['android-app/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: signing key
        run: base64 -d android-app/signing.jks.b64 > android-app/app/fold2.jks
      - name: vision model
        # детектор объектов COCO для VisionActivity: SSD MobileNet v1 quant (uint8, дружит с NNAPI / Hexagon)
        run: |
          mkdir -p android-app/app/src/main/assets/vision
          curl -sSfL -o /tmp/ssd.zip https://storage.googleapis.com/download.tensorflow.org/models/tflite/coco_ssd_mobilenet_v1_1.0_quant_2018_06_29.zip
          unzip -o -j /tmp/ssd.zip detect.tflite labelmap.txt -d android-app/app/src/main/assets/vision
          ls -la android-app/app/src/main/assets/vision
      - name: pad helper (f2pad)
        # экранный джойстик: uinput-помощник под Android arm64 (NDK, API 30) + проверка протокола на x86 (--dry)
        run: |
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          [ -x "$CC" ] || CC=$(ls $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android3*-clang | sort -V | head -1)
          $CC -O2 -Wall -s -o android-app/app/src/main/assets/f2pad android-app/pad/f2pad.c
          file android-app/app/src/main/assets/f2pad
          gcc -O2 -Wall -o /tmp/f2pad-host android-app/pad/f2pad.c
          python3 android-app/pad/test_dry.py /tmp/f2pad-host
      - name: build
        working-directory: android-app
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        # ошибки компиляции - в аннотации запуска (лог задания без прав админа не скачать)
        run: |
          set +e
          gradle --no-daemon assembleDebug 2>&1 | tee /tmp/build.log; r=${PIPESTATUS[0]}
          [ $r = 0 ] || { grep -E "error:|^e: |What went wrong" -A2 /tmp/build.log | head -30 | sed 's/^/::error::/'; exit $r; }
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk fold2-ai.apk
          unzip -l fold2-ai.apk | grep -E "assets/vision/detect.tflite|lib/arm64-v8a/libtensorflowlite" || { echo "нет модели/TFLite в APK"; exit 1; }
          unzip -l fold2-ai.apk | grep -E "assets/f2pad$" || { echo "нет f2pad в APK"; exit 1; }
          sha256sum fold2-ai.apk > fold2-ai.apk.sha256
          TAG=app-${{ github.run_number }}
          gh release create "$TAG" fold2-ai.apk fold2-ai.apk.sha256 --target "${{ github.sha }}" --prerelease \
            --title "Fold2 AI $TAG" --notes "Приложение Fold2 AI: чат LLM (llama.cpp + NPU), клон голоса Qwen3-TTS, картинки FLUX.2 klein, экранный джойстик для игр на мониторе DeX. Нужны root (Magisk), fold2-npu и Debian (linux/phone/debian.sh)."
