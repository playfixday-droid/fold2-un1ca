# Сборка UN1CA (One UI 8 / Android 16) для Galaxy Z Fold2 5G SM-F916B (f2q). Делалось без телефона.
# В этом репозитории только target/f2q; UN1CA (salvogiangri/UN1CA, sixteen) клонируется при сборке.
# Запуск: commit в build.conf / target/** в main или вручную: Actions -> Build f2q -> Run workflow.
# Результат: Releases -> f2q-<номер>. Ошибка: создаётся issue с логом.
name: Build f2q

on:
  push:
    branches: [main]
    paths: ['build.conf', 'target/**', '.github/workflows/build-f2q.yml', '.github/scripts/**']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-f2q
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  KERNEL_COMMIT: 86f2504e4af5c878d327a225682ad988d78016e4  # UN1CA/kernel_samsung_sm8250 sixteen, с ним проверены патчи
  UN1CA_TESTED: 0c2ea1d61ddc78ae8e6900787f9f9e7269b7b439   # salvogiangri/UN1CA sixteen, на нём сверялся target/f2q
  VBMETA_SHA256: 897321b7a434d1acfb059825d0cae16515facd08ede30aa0783bed8ad1a08d66

jobs:
  kernel:
    name: Kernel f2q
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      display_mode: ${{ steps.conf.outputs.display_mode }}
      camera_mass: ${{ steps.conf.outputs.camera_mass }}
      un1ca_ref: ${{ steps.conf.outputs.un1ca_ref }}
      root: ${{ steps.conf.outputs.root }}
      magisk_version: ${{ steps.conf.outputs.magisk_version }}
    steps:
      - uses: actions/checkout@v7

      - name: build.conf
        id: conf
        run: |
          source build.conf
          D=${DISPLAY_MODE:-dual}; M=${CAMERA_MASS:-false}; R=${UN1CA_REF:-latest}
          RT=${ROOT:-magisk}; MV=${MAGISK_VERSION:-v31.1}
          case "$D" in dual|cover) ;; *) echo "DISPLAY_MODE должен быть dual или cover"; exit 1 ;; esac
          case "$M" in true|false) ;; *) echo "CAMERA_MASS должен быть true или false"; exit 1 ;; esac
          case "$RT" in magisk|none) ;; *) echo "ROOT должен быть magisk или none"; exit 1 ;; esac
          [[ "$MV" =~ ^v[0-9]+\.[0-9]+$ ]] || { echo "MAGISK_VERSION вида v31.1"; exit 1; }
          [ "$R" = tested ] && R=$UN1CA_TESTED
          { echo "display_mode=$D"; echo "camera_mass=$M"; echo "un1ca_ref=$R"
            echo "root=$RT"; echo "magisk_version=$MV"; } | tee -a "$GITHUB_OUTPUT"

      # Ядро кэшируется: пересобирается только при смене KERNEL_COMMIT, kernel-src/** или F2Q_BOOT_BOARD
      - name: Kernel cache key
        id: kkey
        run: |
          source target/f2q/config.sh
          echo "board=$(echo "${F2Q_BOOT_BOARD}" | sha256sum | cut -c1-16)" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: kcache
        with:
          path: kout
          key: f2q-kernel-${{ env.KERNEL_COMMIT }}-${{ hashFiles('target/f2q/kernel-src/**') }}-${{ steps.kkey.outputs.board }}

      - name: Free disk space
        if: steps.kcache.outputs.cache-hit != 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Deps
        if: steps.kcache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -yq bc bison flex libssl-dev libelf-dev cpio python3 lz4

      - name: Kernel source + patches
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Kernel source + patches"
          git init -q kernel && cd kernel
          git fetch -q --depth 1 https://github.com/UN1CA/kernel_samsung_sm8250 "$KERNEL_COMMIT"
          git checkout -q FETCH_HEAD
          for p in ../target/f2q/kernel-src/*.patch; do echo "apply $p"; git apply -p1 "$p"; done
          cp ../target/f2q/kernel-src/docker.config arch/arm64/configs/vendor/samsung/docker.config
          cp ../target/f2q/kernel-src/f2q-hw.config arch/arm64/configs/vendor/samsung/f2q-hw.config

      - name: Clang r547379
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Clang r547379"
          cd kernel && mkdir clang-r547379
          wget -q --no-cookies --header "Cookie: gi=0" -O clang.tar.gz \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r547379.tar.gz
          tar -xf clang.tar.gz -C clang-r547379 && rm clang.tar.gz

      - name: Build kernel
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Build kernel"
          cd kernel
          export PATH="$PWD/clang-r547379/bin:$PATH" ARCH=arm64
          B=(-j"$(nproc)" O="$PWD/out" ARCH=arm64 LLVM=1)
          make "${B[@]}" vendor/kona-perf_defconfig vendor/samsung/kona-sec-common.config vendor/samsung/f2q.config \
            vendor/samsung/f2q-hw.config vendor/samsung/docker.config
          # Все =y из наших фрагментов должны дойти до .config (иначе Kconfig молча выкинул опцию из-за зависимости)
          for f in f2q-hw docker; do
            grep -E '^CONFIG_[A-Za-z0-9_]+=y' "arch/arm64/configs/vendor/samsung/$f.config" | while read -r l; do
              grep -qx "$l" out/.config || echo "$f.config: $l"
            done
          done > cfg-missing.txt
          if [ -s cfg-missing.txt ]; then echo "Опции не попали в .config:"; cat cfg-missing.txt; exit 1; fi
          make "${B[@]}"
          # Драйвер вибромотора (cirrus,cs40l25a в DT) должен быть в ядре
          [ -f out/drivers/motor/cs40l2x.o ] || { echo "cs40l2x не собран - вибрации не будет"; exit 1; }
          # Разгон GPU (kernel-src/0003): в базовых DTB (boot) должны быть 800 МГц
          python3 - <<'PY'
          import glob, struct, sys
          f800 = struct.pack('>I', 800000000)
          d = [p for p in glob.glob('out/arch/arm64/boot/dts/vendor/qcom/*.dtb') if f800 in open(p, 'rb').read()]
          print('DTB с 800 МГц GPU:', len(d), d[:3])
          sys.exit(0 if d else 'нет 800 МГц GPU в qcom/*.dtb - разгон не попал в ядро')
          PY

      - name: boot.img
        if: steps.kcache.outputs.cache-hit != 'true'
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### boot.img"
          mkdir -p mkb
          curl -fsSL "https://android.googlesource.com/platform/system/tools/mkbootimg/+archive/refs/heads/main.tar.gz" | tar xz -C mkb
          source target/f2q/config.sh
          MKBOOTIMG="$PWD/mkb/mkbootimg.py" bash target/f2q/kernel-src/make_boot.sh "$PWD/kernel" "$PWD/kout" "${F2Q_BOOT_BOARD}"

      - uses: actions/upload-artifact@v7
        with:
          name: f2q-kernel
          path: kout/*

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: Kernel f2q
        run: python3 .github/scripts/report_failure.py

  rom:
    name: ROM f2q
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          path: f2q

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a -f

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: UN1CA source
        env:
          REF: ${{ needs.kernel.outputs.un1ca_ref }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### UN1CA source ($REF)"
          if [ "$REF" = latest ]; then
            git clone -q --depth 1 -b sixteen https://github.com/salvogiangri/UN1CA un1ca
          else
            git init -q un1ca
            git -C un1ca fetch -q --depth 1 https://github.com/salvogiangri/UN1CA "$REF"
            git -C un1ca checkout -q FETCH_HEAD
          fi
          git -C un1ca submodule update --init --recursive --depth 1 || git -C un1ca submodule update --init --recursive
          git -C un1ca log -1 --format='UN1CA %H (%cs) %s' | tee un1ca.commit
          df -h /

      - name: Add target f2q
        env:
          CAMERA_MASS: ${{ needs.kernel.outputs.camera_mass }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Add target f2q"
          rm -rf un1ca/target/f2q
          cp -a f2q/target/f2q un1ca/target/f2q
          V=un1ca/target/f2q/tools/vbmeta-F916BXXS7KXH1-flags3.img
          base64 -d "$V.b64" > "$V" && rm "$V.b64"
          echo "$VBMETA_SHA256  $V" | sha256sum -c -
          sed -i "s/^TARGET_CAMERA_SUPPORT_MASS_APP_FLAVOR=.*/TARGET_CAMERA_SUPPORT_MASS_APP_FLAVOR=$CAMERA_MASS/" un1ca/target/f2q/config.sh
          grep '^TARGET_CAMERA_SUPPORT_MASS_APP_FLAVOR=' un1ca/target/f2q/config.sh

      - name: Set up build environment
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Set up build environment"
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp lz4 unzip python3
          # erofs/f2fs kernel modules are optional: UN1CA unpacks erofs via fuse.erofs, ext4 is built-in
          if apt-cache show "linux-modules-extra-$(uname -r)" >/dev/null 2>&1; then
            DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq "linux-modules-extra-$(uname -r)" || true
          else
            echo "::warning::linux-modules-extra-$(uname -r) not available, relying on fuse.erofs"
          fi
          sudo modprobe erofs || true
          sudo modprobe f2fs || true
          sudo modprobe fuse || true
          grep -E "erofs|f2fs|fuse|ext4" /proc/filesystems || true
          ls -l /dev/fuse || true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/download-artifact@v8
        with:
          name: f2q-kernel
          path: kout

      - name: Kernel into target
        env:
          MODE: ${{ needs.kernel.outputs.display_mode }}
        run: |
          P=un1ca/target/f2q/patches/kernel/prebuilt
          mkdir -p "$P"
          cp "kout/boot-f2q-$MODE.img" "$P/boot.img"
          cp kout/dtbo.img "$P/dtbo.img"
          ls -la "$P"

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate build config
        working-directory: un1ca
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Generate build config"
          source ./buildenv.sh f2q
          {
            echo "DEBUG=$DEBUG"; echo "SRC_DIR=$SRC_DIR"; echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"; echo "FW_DIR=$FW_DIR"; echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"; echo "WORK_DIR=$WORK_DIR"; echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        working-directory: un1ca
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Build dependencies"
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        working-directory: un1ca
        timeout-minutes: 180
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Download stock firmwares"
          for i in 1 2 3; do
            ./scripts/download_fw.sh && break
            [ "$i" = 3 ] && exit 1
            echo "попытка $i не удалась, повтор"; sleep 60
          done

      - name: Extract stock firmwares
        working-directory: un1ca
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Extract stock firmwares"
          ./scripts/extract_fw.sh
          rm -rf "$ODIN_DIR"
          df -h /

      - name: Build ROM
        working-directory: un1ca
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Build ROM"
          ./scripts/make_rom.sh

      - name: Odin AP
        working-directory: un1ca
        env:
          ROOT: ${{ needs.kernel.outputs.root }}
          MAGISK_VERSION: ${{ needs.kernel.outputs.magisk_version }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Odin AP"
          TF=$(find "$OUT_DIR" -maxdepth 1 -name '*-target_files.zip' | head -1)
          [ -n "$TF" ] || { echo "Нет *-target_files.zip в $OUT_DIR"; exit 1; }
          rm -rf "$WORK_DIR" "$FW_DIR" "$APKTOOL_DIR"
          df -h /
          if [ "$ROOT" = magisk ]; then
            A="$RUNNER_TEMP/Magisk-$MAGISK_VERSION.apk"
            curl -fsSL --retry 5 -o "$A" "https://github.com/topjohnwu/Magisk/releases/download/$MAGISK_VERSION/Magisk-$MAGISK_VERSION.apk"
            unzip -tq "$A"
            echo "Magisk $MAGISK_VERSION sha256 $(sha256sum "$A" | cut -d' ' -f1)" | tee "$GITHUB_WORKSPACE/magisk.txt"
            export MAGISK_APK="$A"
          fi
          bash target/f2q/tools/make_odin_ap.sh "$TF" "$OUT_DIR/odin"
          rm -f "$TF"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.kernel.outputs.display_mode }}
          CAMERA_MASS: ${{ needs.kernel.outputs.camera_mass }}
          ROOT: ${{ needs.kernel.outputs.root }}
        run: |
          exec > >(tee -a "$GITHUB_WORKSPACE/build.log") 2>&1; echo "### Release"
          {
            echo "Galaxy Z Fold2 5G SM-F916B, One UI 8 (UN1CA). На телефоне не проверялось."
            echo
            echo "- Ядро: $MODE, камера mass: $CAMERA_MASS"
            if [ "$ROOT" = magisk ]; then
              echo "- Root: $(cat "$GITHUB_WORKSPACE/magisk.txt") — boot в AP уже с Magisk. После первой загрузки"
              echo "  поставь приложение Magisk-*.apk из этого релиза; если оно попросит «доп. настройку» — согласись (перезагрузка)."
              echo "  Убрать root: Odin -> AP = BOOT_noroot_f2q.tar.md5."
            else
              echo "- Root: нет"
            fi
            echo "- $(cat un1ca.commit)"
            echo "- GPU: частоты до 800 МГц, после загрузки предел 670 МГц (сток). Поднять на ходу: su -c fold2-gpu oc (или 700, 750),"
            echo "  вернуть: su -c fold2-gpu stock, состояние: su -c fold2-gpu. Выбор сохраняется после перезагрузки."
            echo "- Нужен разблокированный загрузчик и на телефоне сток F916BXXS7KXH1 (BL/CP этой версии уже стоят - их не шить)."
            echo
            echo "Скачай все части AP и SHA256SUMS, затем на Linux:"
            echo '```'
            echo "cat AP_f2q_un1ca.tar.md5.part* > AP_f2q_un1ca.tar.md5"
            echo "sha256sum -c --ignore-missing SHA256SUMS"
            echo "sudo odin4 -a AP_f2q_un1ca.tar.md5 -s CSC_OXM_F916BOXM7KXH1_...   # без BL и CP; CSC, не HOME_CSC: сброс данных"
            echo '```'
            echo "Откат: полный сток F916BXXS7KXH1 через Odin. Загрузчик (BL) эта сборка не содержит и не меняет."
          } > notes.md
          python3 f2q/.github/scripts/release.py "$OUT_DIR/odin" kout notes.md

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_NAME: ROM f2q
        run: python3 f2q/.github/scripts/report_failure.py
