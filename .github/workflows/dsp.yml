# DSP-часть NPU (libf2qdsp_skel.so для cDSP Hexagon 698, v66) в нескольких вариантах (подкачка весов в L2 - окно
# F2Q_PF_W, частота DSP - F2Q_CORNER) + проверочная Android-сборка llama-server / llama-bench / f2q-bench с f2qdsp
# (npu-arm.tar.xz) - ~15 мин, для замеров на телефоне раньше tools.yml (он только с main). Новый skel подходит и к
# старым llama-server / f2q-bench (mm2 добавлен в конец интерфейса). Результат: Releases -> dsp-<номер>.
name: DSP

on:
  push:
    branches: [app]
    paths: ['npu/dsp/**', 'npu/common/**', 'npu/idl/**', 'npu/ap/**', 'npu/ggml/**', 'npu/patch_llama.py', 'npu/test/kernel_test.c',
            'npu/test/f2q_bench.c', 'npu/test/mock/**', '.github/workflows/dsp.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  LLAMA_TAG: v0.8.0
  ARM_ARCH: armv8.2-a+dotprod+fp16   # Kryo 585 (Cortex-A77/A55): dotprod + fp16, без i8mm/sve
  HEXAGON_SDK: 6.7.0.0
  HEXAGON_SDK_URL: https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.7.0.0/hexagon-sdk-v6.7.0.0-amd64-lnx.tar.xz
  HEXAGON_TC_URL: https://artifacts.codelinaro.org/artifactory/codelinaro-toolchain-for-hexagon/22.1.8________/clang+llvm-22.1.8-cross-hexagon-unknown-linux-musl_x86_64-linux-gnu.tar.zst
  HEXAGON_TC_SHA256: bc122fe6473ead9693613a6ab3a177c5583653ff76b937e7578cf7de0273315b

jobs:
  skel:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Hexagon SDK + toolchain
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zstd >/dev/null
          H=$RUNNER_TEMP/hex && mkdir -p "$H" && cd "$H"
          curl -fsSL --retry 3 -o sdk.tar.xz "$HEXAGON_SDK_URL"
          T="$HEXAGON_SDK/tools/HEXAGON_Tools/*/Tools"
          tar -xJf sdk.tar.xz --wildcards "$HEXAGON_SDK/incs/*" "$HEXAGON_SDK/ipc/fastrpc/qaic/*" \
            "$HEXAGON_SDK/rtos/qurt/computev68/include/*" "$T/target/hexagon/include/*"
          rm sdk.tar.xz
          curl -fsSL --retry 3 -o tc.tar.zst "$HEXAGON_TC_URL"
          echo "$HEXAGON_TC_SHA256  tc.tar.zst" | sha256sum -c
          mkdir tc && tar --zstd -xf tc.tar.zst -C tc --strip-components=2 && rm tc.tar.zst
          Q=$H/$HEXAGON_SDK
          HXI=$(ls -d "$Q"/tools/HEXAGON_Tools/*/Tools/target/hexagon/include | head -n1)
          { echo "Q=$Q"; echo "HXI=$HXI"; echo "HT=$H/tc"; } | tee -a "$GITHUB_ENV"

      - name: qaic
        run: |
          mkdir -p gen
          "$Q/ipc/fastrpc/qaic/bin/qaic" -mdll -I "$Q/incs" -I "$Q/incs/stddef" npu/idl/f2qdsp.idl -o gen/
          for F in f2qdsp.h f2qdsp_stub.c f2qdsp_skel.c; do [ -s "gen/$F" ] || { echo "ERROR: qaic не создал $F"; exit 1; }; done
          grep -n "f2qdsp_mm2" gen/f2qdsp.h
          grep -n "f2qdsp_serve" gen/f2qdsp.h

      - name: Skel variants
        run: |
          set -euo pipefail
          # имя  окно_подкачки  частота
          V="pf0_turbo:0:HAP_DCVS_VCORNER_TURBO pf0_tp:0:HAP_DCVS_VCORNER_TURBO_PLUS pf4k:4096:HAP_DCVS_VCORNER_TURBO_PLUS
             pf8k:8192:HAP_DCVS_VCORNER_TURBO_PLUS pf16k:16384:HAP_DCVS_VCORNER_TURBO_PLUS pf8k_turbo:8192:HAP_DCVS_VCORNER_TURBO
             pf8k_max:8192:HAP_DCVS_VCORNER_MAX pfall:all:HAP_DCVS_VCORNER_TURBO_PLUS pfall_turbo:all:HAP_DCVS_VCORNER_TURBO"
          for E in $V; do
            N=${E%%:*}; R=${E#*:}; W=${R%%:*}; C=${R#*:}; A=0; [ "$W" = all ] && W=0 && A=1
            O=out/$N; mkdir -p $O/obj
            CF=(--target=hexagon-unknown-elf -mv66 -mhvx -mhvx-length=128b -G0 -fPIC -O2 -ffp-contract=off -fno-stack-protector
                -DF2Q_PF_W=$W -DF2Q_PF_ALL=$A -DF2Q_CORNER=$C
                -I gen -I "$Q/incs" -I "$Q/incs/stddef" -I "$Q/rtos/qurt/computev68/include/qurt"
                -I "$Q/rtos/qurt/computev68/include" -isystem "$HXI")
            for S in npu/dsp/f2qdsp_imp.c npu/dsp/f2q_kernel.c gen/f2qdsp_skel.c; do
              "$HT/bin/clang" "${CF[@]}" -c "$S" -o "$O/obj/$(basename "$S" .c).o"
            done
            "$HT/bin/ld.lld" -shared -soname libf2qdsp_skel.so --hash-style=sysv -Bsymbolic -z max-page-size=4096 \
              -z norelro --no-rosegment -z separate-loadable-segments -z nognustack --wrap=malloc --wrap=calloc \
              --wrap=free --wrap=realloc --wrap=memalign $O/obj/*.o -o $O/libf2qdsp_skel.so
            rm -r $O/obj
            python3 npu/dsp/fix_gotplt.py $O/libf2qdsp_skel.so
            python3 npu/dsp/fix_gotplt.py --check --eflags=0x66 $O/libf2qdsp_skel.so
            python3 npu/dsp/check_skel.py $O/libf2qdsp_skel.so
            U=$("$HT/bin/llvm-nm" -D --undefined-only $O/libf2qdsp_skel.so | awk '{print $NF}' | LC_ALL=C sort -u)
            MISS=$(echo "$U" | LC_ALL=C comm -23 - <(grep -v '^#' npu/dsp/fastrpc_shell_unsigned_3.syms))
            [ -z "$MISS" ] || { echo "ERROR: $N: этих символов нет в fastrpc_shell_unsigned_3 Fold2: $MISS"; exit 1; }
            N2=$("$HT/bin/llvm-objdump" -d $O/libf2qdsp_skel.so | grep -c l2fetch || true)
            echo "::notice::$N: окно $W, $C, l2fetch в коде: $N2"
          done
          ls -laR out

      - name: HVX kernel test (qemu-hexagon)
        run: |
          set -euo pipefail
          for W in 0 8192 all; do
            A=0; [ $W = all ] && A=1
            "$HT/bin/clang" --target=hexagon-unknown-linux-musl -mv66 -mhvx -mhvx-length=128b -O2 -ffp-contract=off -DF2Q_PF_W=${W/all/0} -DF2Q_PF_ALL=$A \
              --sysroot="$HT/target/hexagon-unknown-linux-musl" -fuse-ld=lld -static \
              npu/test/kernel_test.c npu/dsp/f2q_kernel.c npu/common/f2q_pack.c -lm -o out/kernel_test_hvx_$W
          done
          docker run --rm -v "$PWD/out:/w" debian:trixie sh -c \
            'apt-get update -qq && apt-get install -y -qq qemu-user >/dev/null && qemu-hexagon --version | head -n1 && qemu-hexagon /w/kernel_test_hvx_0 | tail -n 3 && qemu-hexagon /w/kernel_test_hvx_8192 | tail -n 3 && qemu-hexagon /w/kernel_test_hvx_all | tail -n 3'
          rm out/kernel_test_hvx_*

      - name: Mock (DSP в процессе) - f2q-bench, режимы весов
        run: |
          set -euo pipefail
          MOCK=(-DF2QDSP_MOCK -Inpu/test/mock -Igen -I"$Q/incs" -I"$Q/incs/stddef")
          gcc -O2 -ffp-contract=off -fno-strict-aliasing "${MOCK[@]}" npu/test/f2q_bench.c npu/ap/f2q_dev.c npu/ap/f2q_cpu.c \
            npu/common/f2q_pack.c npu/dsp/f2q_kernel.c npu/test/mock/mock_dsp.c -lpthread -ldl -lm -o out/f2q-bench-mock
          for WM in 0 1 2 3; do for PO in 0 1; do for MB in 0 1; do
            echo "== F2QDSP_WMODE=$WM F2QDSP_POOL=$PO F2QDSP_MBOX=$MB"
            F2QDSP=1 F2QDSP_DEBUG=1 F2QDSP_WMODE=$WM F2QDSP_POOL=$PO F2QDSP_MBOX=$MB F2QDSP_STATS=10 ./out/f2q-bench-mock 200 320 | tee out/mock.txt
            grep -q "ИТОГ: OK" out/mock.txt
            if [ "$MB" = 1 ]; then grep -q "selftest ящик q8: OK" out/mock.txt; fi
          done; done; done
          rm out/f2q-bench-mock out/mock.txt

      - name: Android (NDK) - llama.cpp f2qdsp, f2q-bench
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq ninja-build >/dev/null
          git clone -q --depth 1 -b "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp llama.cpp
          python3 npu/patch_llama.py llama.cpp
          NDK=$ANDROID_NDK_LATEST_HOME
          cmake -S llama.cpp -B bandroid -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH="$ARM_ARCH" -DLLAMA_OPENSSL=OFF -DGGML_OPENMP=OFF -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DGGML_CPU_F2QDSP=ON -DGGML_CPU_F2QDSP_SRC="$PWD/npu" -DGGML_CPU_F2QDSP_GEN="$PWD/gen" \
            -DGGML_CPU_F2QDSP_SDK="$Q"
          cmake --build bandroid -j"$(nproc)" --target llama-server llama-bench
          CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang
          mkdir -p arm/bin
          "$CC" -O2 -march="$ARM_ARCH" -ffp-contract=off -fno-strict-aliasing -Igen -I"$Q/incs" -I"$Q/incs/stddef" \
            npu/test/f2q_bench.c npu/ap/f2q_dev.c npu/ap/f2q_cpu.c npu/common/f2q_pack.c npu/dsp/f2q_kernel.c \
            -ldl -lm -o arm/bin/f2q-bench
          cp bandroid/bin/llama-server bandroid/bin/llama-bench arm/bin/
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-all arm/bin/*
          chmod 755 arm/bin/*
          for F in arm/bin/*; do grep -q libcdsprpc.so "$F" || { echo "ERROR: в $F нет f2qdsp"; exit 1; }; done
          tar --owner=0 --group=0 --numeric-owner -C arm -cJf npu-arm.tar.xz bin
          ls -la npu-arm.tar.xz arm/bin

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -C out -czf dsp-skel-variants.tar.gz .
          sha256sum dsp-skel-variants.tar.gz npu-arm.tar.xz > SHA256SUMS
          TAG=dsp-${{ github.run_number }}
          gh release create "$TAG" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG (NPU skel, варианты)" \
            --notes "libf2qdsp_skel.so (cDSP v66): pfN - окно подкачки весов в L2, tp/turbo/max - частота DSP; npu-arm.tar.xz - llama-server, llama-bench, f2q-bench (Android arm64) с mm2 (F2QDSP_WMODE / F2QDSP_POOL / F2QDSP_STATS) и почтовым ящиком (F2QDSP_MBOX, F2QDSP_IDLE_MS)" dsp-skel-variants.tar.gz npu-arm.tar.xz SHA256SUMS
