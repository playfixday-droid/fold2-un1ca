# GPU (Adreno 650, OpenCL) + NPU (Hexagon cDSP, f2qdsp) + CPU (repack) для Fold2 - одна сборка каждой нейросети под
# Android (bionic, NDK): llama.cpp (чат), sd.cpp (FLUX), qwentts.cpp (голос), whisper.cpp (распознавание речи).
# Устройство выбирает запуск: CPU, GPU (OpenCL, вендорская /vendor/lib64/libOpenCL.so), NPU (F2QDSP=1 - веса Q4_0/Q8_0
# MUL_MAT на cDSP, остальное - CPU) и их сочетания (часть слоёв на GPU, остальное - CPU или NPU).
# Кернелы OpenCL лежат рядом с программой (*.cl, читаются из текущей папки): их можно поправить на телефоне без пересборки.
# gpu/patch_opencl.py: кернелы, которые драйвер Adreno 650 (OpenCL 2.0) не компилирует, больше не роняют запуск.
name: GPU

on:
  push:
    branches: [app]
    paths: ['.github/workflows/gpu.yml', 'gpu/**']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  SD_COMMIT: 58bb3c1b1cd4749e94e39f537e9adfce295dcaee   # как sdnpu.yml: на нём проверены patch_sdcpp.py и флаги ai_server.py
  HEXAGON_SDK: 6.7.0.0
  HEXAGON_SDK_URL: https://github.com/snapdragon-toolchain/hexagon-sdk/releases/download/v6.7.0.0/hexagon-sdk-v6.7.0.0-amd64-lnx.tar.xz

jobs:
  build:
    name: ${{ matrix.what }} (Android, OpenCL + NPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        what: [llama, sdcpp, qwentts, whisper]
    steps:
      - uses: actions/checkout@v4

      - name: NDK + OpenCL headers/loader
        run: |
          set -euo pipefail
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}; echo "NDK=$NDK" >> "$GITHUB_ENV"; ls "$NDK"
          SR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          sudo cp -r OpenCL-Headers/CL "$SR/usr/include/"
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DOPENCL_ICD_LOADER_HEADERS_DIR=$SR/usr/include -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          ninja -C icd
          sudo cp icd/libOpenCL.so "$SR/usr/lib/aarch64-linux-android/"

      - name: Hexagon SDK (заголовки + qaic) для F2QDSP
        run: |
          set -euo pipefail
          H=$RUNNER_TEMP/hex && mkdir -p "$H" && cd "$H"
          curl -fsSL --retry 3 -o sdk.tar.xz "$HEXAGON_SDK_URL"
          tar -xJf sdk.tar.xz --wildcards "$HEXAGON_SDK/incs/*" "$HEXAGON_SDK/ipc/fastrpc/qaic/*"
          rm sdk.tar.xz
          Q=$H/$HEXAGON_SDK; echo "Q=$Q" >> "$GITHUB_ENV"
          cd "$GITHUB_WORKSPACE"; mkdir -p gen
          "$Q/ipc/fastrpc/qaic/bin/qaic" -mdll -I "$Q/incs" -I "$Q/incs/stddef" npu/idl/f2qdsp.idl -o gen/
          ls -la gen

      - name: Build
        run: |
          set -euo pipefail
          W=${{ matrix.what }}
          # ошибки - в аннотации (логи job без входа не читаются): команда, строка и хвост лога
          ann() { local t; t=$(tail -n "${2:-30}" "$1" | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g'); echo "::error::$W $1:%0A$t"; }
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          set -E; trap 'rc=$?; echo "::error::$W: строка $LINENO: $BASH_COMMAND -> $rc"; ann "$RUNNER_TEMP/build.log" 25' ERR
          case $W in
            llama) git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src ;;
            sdcpp) git init -q src && git -C src remote add origin https://github.com/leejet/stable-diffusion.cpp
                   git -C src fetch -q --depth 1 origin "$SD_COMMIT" && git -C src checkout -q FETCH_HEAD
                   git -C src submodule update -q --init --recursive --depth 1 || git -C src submodule update -q --init --recursive ;;
            qwentts) git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/ServeurpersoCom/qwentts.cpp src ;;
            whisper) git clone -q --depth 1 https://github.com/ggml-org/whisper.cpp src ;;
          esac
          mkdir -p out; (cd src && git log -1 --format='%h %cd') | tee out/$W.version
          python3 gpu/patch_opencl.py src
          python3 npu/patch_llama.py src
          case $W in
            sdcpp) python3 npu/patch_sdcpp.py src ;;
            # патчи fold2 (голоса из кэша, DAC на GPU, QT_REPACK) без их сборки под Debian + QT_REPACK=2 - веса на NPU
            qwentts) sed '/^cmake /d' linux/phone/qwentts_fold2.sh > qp.sh && bash qp.sh "$PWD/src" && python3 gpu/patch_qtnpu.py src ;;
          esac
          A=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake
             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-30 -DANDROID_STL=c++_static -DBUILD_SHARED_LIBS=OFF
             -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_OPENCL=ON
             -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=OFF -DGGML_OPENCL_TARGET_VERSION=200)
          NPUF=(-DGGML_CPU_F2QDSP=ON -DGGML_CPU_F2QDSP_SRC="$PWD/npu" -DGGML_CPU_F2QDSP_GEN="$PWD/gen" -DGGML_CPU_F2QDSP_SDK="$Q")
          case $W in
            llama) X=(-DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF); T="llama-server llama-cli llama-bench" ;;
            sdcpp) X=(-DSD_OPENCL=ON); T="sd-cli" ;;
            qwentts) X=(); T="qwen-tts tts-server qwen-codec" ;;
            whisper) X=(-DWHISPER_BUILD_TESTS=OFF -DWHISPER_SDL2=OFF -DWHISPER_CURL=OFF); T="whisper-cli" ;;
          esac
          bld() {
            rm -rf b
            cmake -S src -B b "${A[@]}" "${X[@]}" "$@" > cmake.log 2>&1 || { ann cmake.log 30; return 1; }
            ninja -C b $T > ninja.log 2>&1 || { grep -m 8 -E 'error' ninja.log | cut -c1-400 | while read -r L; do echo "::error::$W: $L"; done || true; ann ninja.log 25; return 1; }
          }
          if bld "${NPUF[@]}"; then echo "F2QDSP (NPU): да" | tee out/$W.npu
          else echo "::warning::$W: сборка с NPU (F2QDSP) не удалась - собираю без NPU"; bld; fi
          ST=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          for F in $T; do cp "$(find b -name $F -type f | head -n 1)" out/; "$ST" --strip-all out/$F; done
          cp src/ggml/src/ggml-opencl/kernels/*.cl out/
          # f2cl3: LD_PRELOAD-заглушка, если ggml всё же зовёт функцию OpenCL 3.0 (у Adreno 650 - драйвер 2.0)
          cat > f2cl3.c <<'C'
          #include <dlfcn.h>
          #include <stddef.h>
          #include <stdint.h>
          typedef void *cl_context, *cl_mem; typedef uint64_t cl_mem_flags; typedef intptr_t cl_mem_properties; typedef int32_t cl_int;
          cl_mem clCreateBufferWithProperties(cl_context c, const cl_mem_properties *p, cl_mem_flags f, size_t n, void *h, cl_int *e) {
            static cl_mem (*real)(cl_context, const cl_mem_properties *, cl_mem_flags, size_t, void *, cl_int *);
            static cl_mem (*cb)(cl_context, cl_mem_flags, size_t, void *, cl_int *);
            if (!real && !cb) { void *l = dlopen("libOpenCL.so", RTLD_NOW); if (l) { real = dlsym(l, "clCreateBufferWithProperties"); cb = dlsym(l, "clCreateBuffer"); } }
            if (real && real != clCreateBufferWithProperties) return real(c, p, f, n, h, e);
            return cb ? cb(c, f, n, h, e) : NULL;
          }
          C
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang -O2 -shared -fPIC -o out/libf2cl3.so f2cl3.c -ldl
          for F in $T; do echo "== $F: NEEDED $($NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d out/$F | grep -o 'NEEDED.*' | tr '\n' ' ')"
            strings out/$F | grep -c 'F2QDSP' || true; done
          ls -la out > ls.txt; head -n 20 ls.txt; echo "кернелов: $(ls out/*.cl | wc -l)"   # ls | head - EPIPE и exit 2 при pipefail
          echo "::notice::$W: собрано, $(cat out/$W.version), NPU: $([ -f out/$W.npu ] && echo да || echo нет)"
          tar -C out -cJf gpu-$W-android-arm64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ matrix.what }}
          path: gpu-${{ matrix.what }}-android-arm64.tar.xz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la art; cd art; sha256sum *.tar.xz > SHA256SUMS; cat SHA256SUMS
          TAG=gpu-${{ github.run_number }}
          gh release create "$TAG" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG (Adreno OpenCL + NPU)" \
            --notes "llama.cpp / sd.cpp / qwentts.cpp / whisper.cpp под Android: CPU, GPU (OpenCL) и NPU (F2QDSP). Запуск: LD_LIBRARY_PATH=/vendor/lib64" ./*.tar.xz SHA256SUMS
