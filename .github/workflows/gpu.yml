# GPU (Adreno 650, OpenCL) для Fold2: sd-cli (FLUX), qwen-tts (голос), llama.cpp - сборка под Android (bionic) через NDK.
# Запуск на телефоне от root:  LD_LIBRARY_PATH=/vendor/lib64 ./sd-cli ...  (OpenCL - вендорская /vendor/lib64/libOpenCL.so)
name: GPU

on:
  push:
    branches: [app]
    paths: ['.github/workflows/gpu.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.what }} (Android, OpenCL)
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        what: [sdcpp, qwentts, llama]
    steps:
      - name: NDK + OpenCL headers/loader
        run: |
          set -euo pipefail
          NDK=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}; echo "NDK=$NDK" >> "$GITHUB_ENV"; ls "$NDK"
          SR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenCL-Headers
          sudo cp -r OpenCL-Headers/CL "$SR/usr/include/"
          git clone -q --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader
          cmake -S OpenCL-ICD-Loader -B icd -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DOPENCL_ICD_LOADER_HEADERS_DIR=$SR/usr/include -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 -DANDROID_STL=c++_shared
          ninja -C icd
          sudo cp icd/libOpenCL.so "$SR/usr/lib/aarch64-linux-android/"
      - name: Build
        run: |
          set -euo pipefail
          A=(-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake
             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DBUILD_SHARED_LIBS=OFF
             -DGGML_OPENMP=OFF -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16 -DGGML_OPENCL=ON
             -DGGML_OPENCL_USE_ADRENO_KERNELS=ON -DGGML_OPENCL_EMBED_KERNELS=ON)
          mkdir -p out
          case "${{ matrix.what }}" in
            sdcpp)
              git clone -q --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp src
              (cd src && git log -1 --format='%h %cd' | tee ../out/sdcpp.version)
              cmake -S src -B b "${A[@]}" -DSD_OPENCL=ON
              ninja -C b sd-cli 2>&1 | tail -n 20
              cp "$(find b -name sd-cli -type f | head -n 1)" out/ ;;
            qwentts)
              git clone -q --depth 1 --recurse-submodules --shallow-submodules https://github.com/ServeurpersoCom/qwentts.cpp src
              (cd src && git log -1 --format='%h %cd' | tee ../out/qwentts.version)
              cmake -S src -B b "${A[@]}"
              ninja -C b qwen-tts 2>&1 | tail -n 20
              cp "$(find b -name qwen-tts -type f | head -n 1)" out/ ;;
            llama)
              git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src
              (cd src && git log -1 --format='%h %cd' | tee ../out/llama.version)
              cmake -S src -B b "${A[@]}" -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF
              ninja -C b llama-bench llama-server llama-cli 2>&1 | tail -n 20
              for F in llama-bench llama-server llama-cli; do cp "$(find b -name $F -type f | head -n 1)" out/; done ;;
          esac
          file out/* ; ls -la out
          tar -C out -cJf gpu-${{ matrix.what }}-android-arm64.tar.xz .
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-${{ matrix.what }}
          path: gpu-${{ matrix.what }}-android-arm64.tar.xz

  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la art; cd art; sha256sum *.tar.xz > SHA256SUMS; cat SHA256SUMS
          TAG=gpu-${{ github.run_number }}
          gh release create "$TAG" -R "${{ github.repository }}" --target "${{ github.sha }}" --title "$TAG (Adreno OpenCL)" \
            --notes "sd-cli / qwen-tts / llama.cpp под Android с OpenCL (Adreno). Запуск: LD_LIBRARY_PATH=/vendor/lib64" ./*.tar.xz SHA256SUMS
