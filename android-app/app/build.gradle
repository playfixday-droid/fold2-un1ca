plugins { id 'com.android.application' }
android {
    namespace 'com.fold2.ai'
    compileSdk 34
    defaultConfig {
        applicationId 'com.fold2.ai'
        minSdk 30
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('APP_VERSION_CODE') ?: '1')
        versionName '1.' + (System.getenv('APP_VERSION_CODE') ?: '0')
        ndk { abiFilters 'arm64-v8a' }  // только Fold2: без лишних ABI библиотек TFLite
    }
    // постоянный ключ (из android-app/signing.jks.b64, его раскладывает CI): обновления ставятся поверх, без удаления
    signingConfigs {
        fold2 { storeFile file('fold2.jks'); storePassword 'fold2ai'; keyAlias 'fold2'; keyPassword 'fold2ai' }
    }
    buildTypes { debug { signingConfig signingConfigs.fold2 } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
// зрение (VisionActivity): TFLite + делегаты NNAPI (NPU, в основной библиотеке) и GPU; модель - assets/vision (качает CI)
dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-gpu-api:2.16.1'
}
