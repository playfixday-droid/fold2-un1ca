<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Fold2 AI</title>
<style>
:root{--bg:#0e0e10;--fg:#ececec;--mut:#9a9aa0;--acc:#3d8bfd;--card:#1b1b1f;--bd:#2c2c31}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
nav{display:flex;position:sticky;top:0;background:#000;z-index:2}
nav button{flex:1;padding:12px 2px;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);font-size:14px}
nav button.on{color:var(--fg);border-color:var(--acc)}
section{display:none;padding:10px}section.on{display:block}
textarea,input,select{width:100%;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:15px;font-family:inherit}
.b{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 13px;font-size:14px;margin:6px 6px 0 0}
.b2{background:#2e2e34}.b:disabled{opacity:.5}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:6px 0}
.st{color:var(--mut);font-size:13px;white-space:pre-wrap;margin:6px 0;word-break:break-word}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
.u{background:#1f3350;margin-left:28px}.th{color:#889;font-size:12px;white-space:pre-wrap;border-left:2px solid #445;padding-left:6px;margin-bottom:4px}.a{background:var(--card);margin-right:8px}
img{max-width:100%;border-radius:8px;margin-top:6px}audio{width:100%;margin-top:6px}
#log{font:11px/1.35 monospace;color:#8c8;white-space:pre-wrap;word-break:break-all;margin-top:8px}
label{display:flex;gap:6px;align-items:center}label input{width:auto}
.bx{background:#5a2a2a}.hide{display:none}
#gal{display:flex;gap:6px;overflow-x:auto;margin-top:8px}#gal img{width:72px;height:72px;object-fit:cover;margin:0;flex:none;border:1px solid var(--bd)}
#aud div{padding:6px 0;color:var(--acc);font-size:13px;border-bottom:1px solid var(--bd)}
</style></head><body>
<nav><button data-t="chat" class="on">Чат</button><button data-t="voice">Голос</button><button data-t="img">Картинка</button><button data-t="sys">Система</button></nav>

<section id="chat" class="on">
 <div class="row"><select id="model"></select></div>
 <div class="row"><label><input type="checkbox" id="npu">NPU (DSP)</label><label><input type="checkbox" id="think">Размышления</label>
  <button class="b" id="llmStart">Запустить</button><button class="b b2" id="llmStop">Стоп</button><button class="b b2" id="clear">Очистить</button></div>
 <div class="st" id="llmSt">модель не запущена. Быстрее всего: Q4_0 на CPU (NPU пока медленнее)</div>
 <div id="msgs"></div>
 <textarea id="q" rows="2" placeholder="Сообщение…"></textarea>
 <button class="b" id="send">Отправить</button><button class="b bx hide" id="stopGen">■ Стоп</button>
</section>

<section id="voice">
 <textarea id="ttsText" rows="4">Привет! Это голос, синтезированный прямо на Galaxy Z Fold2, без облака.</textarea>
 <div class="row"><select id="lang"><option>Russian</option><option>English</option><option>Auto</option><option>Chinese</option><option>German</option><option>French</option><option>Spanish</option><option>Italian</option><option>Portuguese</option><option>Japanese</option><option>Korean</option></select></div>
 <div class="st">Чей голос (образец 3–20 с):</div>
 <div class="row"><select id="refSel"><option value="sample">Образец Qwen (англ.)</option><option value="rec">Мой голос (запись)</option><option value="pick">Файл с телефона</option></select></div>
 <div class="row"><button class="b b2" id="rec">● Записать</button><button class="b b2" id="pick">Выбрать файл</button></div>
 <input id="refText" placeholder="Что сказано в образце (пусто - только тембр)">
 <button class="b" id="tts">Озвучить</button><button class="b bx hide" id="ttsX">Отмена</button>
 <div class="st" id="ttsSt"></div>
 <audio id="au" controls></audio>
 <div class="st">Последние:</div><div id="aud"></div>
</section>

<section id="img">
 <textarea id="prompt" rows="3">a red fox sitting in a snowy forest at sunrise, photo, high detail</textarea>
 <div class="row"><select id="size" style="flex:1"><option value="256x256">256×256 (~2,5 мин)</option><option value="384x384">384×384 (~4 мин)</option><option value="512x512">512×512 (~6,5 мин)</option><option value="768x512">768×512 (~10 мин)</option><option value="512x768">512×768 (~10 мин)</option></select>
  <span class="st">шаги</span><input id="steps" type="number" value="4" min="1" max="30" style="width:58px">
  <span class="st">seed</span><input id="seed" type="number" value="-1" style="width:76px"></div>
 <button class="b" id="gen">Сгенерировать</button><button class="b bx hide" id="genX">Отмена</button><button class="b b2 hide" id="seedKeep">seed ↺</button>
 <div class="st" id="imgSt">FLUX.2 klein 4B на процессоре (repack): время указано для 4 шагов</div>
 <img id="out">
 <div id="gal"></div>
</section>

<section id="sys">
 <button class="b b2" id="stat">Состояние</button><button class="b b2" id="aiStart">Запустить TTS/FLUX</button><button class="b b2" id="aiStop">Остановить TTS/FLUX</button><button class="b b2" id="aiRe">Перезапустить TTS/FLUX</button><button class="b b2" id="npuTest">Тест NPU</button><button class="b b2" id="logs">Логи</button>
 <div id="log"></div>
</section>

<script>
const $=id=>document.getElementById(id);
const LLM='http://127.0.0.1:8081', AI='http://127.0.0.1:8082';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let seq=0; const H={};
function F2cb(id,t,d){const h=H[id]; if(h) h(t,d);}
function sh(cmd,onLine){return new Promise((res,rej)=>{const id='s'+(++seq),out=[];
 H[id]=(t,d)=>{if(t=='line'){out.push(d);onLine&&onLine(d);}else{delete H[id]; t=='exit'?res({code:+d,out:out.join('\n')}):rej(d);}}; F2.sh(id,cmd);});}
function http(method,url,body,mode,onChunk){const id='h'+(++seq); const p=new Promise((res,rej)=>{
 H[id]=(t,d)=>{if(t=='chunk'){onChunk&&onChunk(d);}else{delete H[id]; t=='done'?res(d):rej(d);}}; F2.http(id,method,url,body||'',mode||'text');}); p.hid=id; return p;}
const SRV_VER=8; // версия ai_server.py в этом APK: старый сервер перезапускаем
const fmt=s=>{s=Math.max(0,Math.round(s)); return s<60?s+' с':Math.floor(s/60)+' мин'+(s%60?' '+s%60+' с':'');};
const DIR=F2.dir(), RDIR=DIR.replace('/storage/emulated/0','/data/media/0');
const toCh=p=>p.replace('/storage/emulated/0','/sdcard');
const S='sh '+RDIR+'/f2ai/f2ai.sh ';
function log(s){const l=$('log'); l.textContent+=s+'\n'; if(l.textContent.length>20000) l.textContent=l.textContent.slice(-15000);}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.t).classList.add('on');});
function back(){const c=document.querySelector('nav button.on'); if(c&&c.dataset.t!='chat'){document.querySelector('nav button[data-t=chat]').click();return true;} return false;}

async function status(show){
 try{const r=await sh(S+'status'); const kv={}; r.out.split('\n').forEach(l=>{const i=l.indexOf('='); if(i>0) kv[l.slice(0,i)]=l.slice(i+1);});
  const sel=$('model'), list=(kv.models||'').split(' ').filter(x=>x);
  if(list.join()!=[...sel.options].map(o=>o.value).join()){ sel.innerHTML=''; list.forEach(m=>{const o=document.createElement('option');o.textContent=m;sel.appendChild(o);});
   const pref=localStorage.model; if(list.includes(pref)) sel.value=pref; else {const q4=list.find(m=>/Q4_0/.test(m)); if(q4) sel.value=q4;} }
  if(show){ log('NPU-пакет: '+(kv.npu=='1'?'есть':'нет')+' | Debian: '+(kv.debian=='1'?'есть':'нет')+' | TTS: '+(kv.tts=='1'?'есть':'нет')+' | FLUX (sd.cpp): '+(kv.sd=='1'?(kv.sdcpu=='1'?'есть, быстрый repack':'есть'):'нет'));
   log('модели: '+(kv.models||'-')); log('FLUX: '+(kv.flux||'-')+' | TTS-модель: '+(kv.ttsmodel=='1'?'есть':'нет')+' | qwentts.cpp: '+(kv.qwentts=='11'?'есть (быстрый)':'нет'));
   log('свободно памяти: '+kv.mem+' МБ'); if(kv.setup) log('установка: '+kv.setup); if(kv.ttssetup) log('установка TTS: '+kv.ttssetup);
   log('чат: '+((await llmUp())?'запущен':'не запущен')+' | TTS/FLUX сервер: '+((await aiUp())?'запущен':'не запущен')); }
  return kv;
 }catch(e){ log('ошибка root: '+e+'\nРазреши приложению root в Magisk.'); }
}
async function llmUp(){try{await http('GET',LLM+'/health');return true;}catch(e){return false;}}
async function aiUp(){try{return JSON.parse(await http('GET',AI+'/health'));}catch(e){return null;}}
async function waitUp(f,n){for(let i=0;i<n;i++){const r=await f(); if(r) return r; await sleep(1000);} return null;}

// ---------- чат
let hist=[], busy=false, cur=null, stopReq=false;
try{hist=JSON.parse(localStorage.hist||'[]');}catch(e){hist=[];}
const saveHist=()=>{try{localStorage.hist=JSON.stringify(hist.slice(-60));}catch(e){}};
function addMsg(cls,t){const d=document.createElement('div'); d.className='msg '+cls; d.textContent=t; $('msgs').appendChild(d); d.scrollIntoView({block:'end'}); return d;}
hist.forEach(m=>addMsg(m.role=='user'?'u':'a',m.content));
async function startLLM(){const m=$('model').value; if(!m){ $('llmSt').textContent='нет моделей в /sdcard/models'; return false; }
 localStorage.model=m; const npu=$('npu').checked;
 $('llmSt').textContent='запуск '+m+(npu?' на NPU':' на CPU')+'…';
 await sh(S+'llm-start '+m+' '+(npu?1:0), l=>log(l)).catch(e=>log(e));
 if(await waitUp(llmUp,120)){ $('llmSt').textContent='готово: '+m+(npu?' (NPU + CPU)':' (CPU)'); return true; }
 $('llmSt').textContent='не запустилась - Система → Логи'; return false;}
$('llmStart').onclick=startLLM;
$('llmStop').onclick=async()=>{await sh(S+'llm-stop',l=>log(l)).catch(e=>log(e)); $('llmSt').textContent='остановлена';};
$('clear').onclick=()=>{hist=[]; saveHist(); $('msgs').innerHTML='';};
$('stopGen').onclick=()=>{ stopReq=true; if(cur) F2.cancel(cur); };
const SYS='Ты полезный ассистент на телефоне Galaxy Z Fold2. Отвечай по-русски, кратко и по делу.';
// контекст сервера 4096 токенов: старые реплики отбрасываем, чтобы запрос + ответ влезли (~2,5 символа на токен)
function ctxMsgs(maxTok){let budget=(4096-maxTok-200)*2.5, out=[];
 for(let i=hist.length-1;i>=0;i--){const n=hist[i].content.length; if(out.length&&budget-n<0) break; budget-=n; out.unshift(hist[i]);}
 if(out.length&&out[0].role!='user') out.shift(); return out;}
async function send(){ if(busy) return; const t=$('q').value.trim(); if(!t) return; busy=true; $('send').disabled=true;
 if(!await llmUp()){ $('llmSt').textContent='модель не запущена - запускаю…'; if(!await startLLM()){ busy=false; $('send').disabled=false; return; } }
 $('q').value='';
 hist.push({role:'user',content:t}); addMsg('u',t); const el=addMsg('a','…'); let acc='', rs='', tim=null; const think=$('think').checked;
 const th=document.createElement('div'); th.className='th'; const tx=document.createElement('div');
 el.textContent=''; el.appendChild(th); el.appendChild(tx); tx.textContent='…';
 // LFM3 и без «Размышлений» иногда думает в content и закрывает </think> - делим сами
 const split=()=>{ const a=acc.replace(/^\s*<think>/,''), i=a.indexOf('</think>'); return i<0?[rs,a]:[(rs+a.slice(0,i)).trim(),a.slice(i+8).trim()]; };
 let pend=false; const show=()=>{ if(pend) return; pend=true; requestAnimationFrame(()=>{ pend=false; const [r,c]=split(); th.textContent=r?'💭 '+r:''; tx.textContent=c||'…'; el.scrollIntoView({block:'end'}); }); };
 const maxTok=think?2048:1024; let stopped=false; stopReq=false;
 $('stopGen').classList.remove('hide');
 try{ const p=http('POST',LLM+'/v1/chat/completions',JSON.stringify({messages:[{role:'system',content:SYS}].concat(ctxMsgs(maxTok)),stream:true,
     cache_prompt:true,max_tokens:maxTok,temperature:0.3,chat_template_kwargs:{enable_thinking:think}}),'sse',d=>{
   if(d=='[DONE]') return; try{const j=JSON.parse(d), dl=j.choices&&j.choices[0]&&j.choices[0].delta;
    if(dl){ if(dl.reasoning_content) rs+=dl.reasoning_content; if(dl.content) acc+=dl.content; show(); }
    if(j.timings) tim=j.timings;}catch(e){} });
  cur=p.hid; await p.catch(e=>{ if(!stopReq) throw e; }); stopped=stopReq;
 }catch(e){ tx.textContent='ошибка: '+e+'\n(Система → Логи)'; hist.pop(); saveHist(); }
 finally{ cur=null; $('stopGen').classList.add('hide'); }
 if(tx.textContent.indexOf('ошибка: ')!=0){
  const [r,c]=split(); th.textContent=r?'💭 '+r:''; acc=c; tx.textContent=acc||(stopped?'(остановлено)':rs?'(модель только размышляла - увеличьте лимит или выключите «Размышления»)':'(пустой ответ)');
  if(stopped&&acc) tx.textContent=acc+' …(остановлено)';
  hist.push({role:'assistant',content:acc||'…'}); saveHist();
  if(tim) $('llmSt').textContent='ответ '+tim.predicted_per_second.toFixed(1)+' т/с, чтение запроса '+tim.prompt_per_second.toFixed(1)+' т/с ('+tim.predicted_n+' токенов'+(tim.cache_n?', из кэша '+tim.cache_n:'')+')';
 }
 busy=false; $('send').disabled=false; }
$('send').onclick=send;

// ---------- голос
const SAMPLE_TEXT='Okay. Yeah. I resent you. I love you. I respect you. But you know what? You blew it! And thanks to you.';
let recPath=null, pickPath=null, recOn=false;
$('refText').value=SAMPLE_TEXT;
// поля и выбранный образец голоса переживают пересоздание окна (сложили/развернули, ушли из приложения)
$('npu').checked=localStorage.npu=='1'; $('npu').onchange=()=>localStorage.npu=$('npu').checked?'1':'0';
$('think').checked=localStorage.think=='1'; $('think').onchange=()=>localStorage.think=$('think').checked?'1':'0';
const KEEP=['ttsText','refText','refSel','lang','prompt','size','steps','seed'];
KEEP.forEach(k=>{const v=localStorage['f_'+k]; if(v!=null) $(k).value=v; $(k).addEventListener('change',()=>localStorage['f_'+k]=$(k).value); $(k).addEventListener('input',()=>localStorage['f_'+k]=$(k).value);});
recPath=localStorage.recPath||null; pickPath=localStorage.pickPath||null;
function keepRef(){ if(recPath) localStorage.recPath=recPath; if(pickPath) localStorage.pickPath=pickPath; localStorage.f_refSel=$('refSel').value; localStorage.f_refText=$('refText').value; }
$('refSel').onchange=()=>{ if($('refSel').value=='sample') $('refText').value=SAMPLE_TEXT; else if($('refText').value==SAMPLE_TEXT) $('refText').value=''; };
$('rec').onclick=()=>{ if(recOn){ F2.recStop(); return; } const id='r'+(++seq); recOn=true; $('rec').textContent='■ Стоп';
 $('ttsSt').textContent='запись… говорите 5–10 секунд, потом «Стоп»';
 H[id]=(t,d)=>{ delete H[id]; recOn=false; $('rec').textContent='● Записать';
  if(t=='done'){ const [p,s]=d.split('|'); recPath=p; $('refSel').value='rec'; if($('refText').value==SAMPLE_TEXT) $('refText').value=''; keepRef(); $('ttsSt').textContent='записано '+(+s).toFixed(1)+' с. Впишите ниже, что сказали (так клон точнее)'; }
  else $('ttsSt').textContent=d; };
 F2.recStart(id); };
$('pick').onclick=()=>{ const id='p'+(++seq); H[id]=(t,d)=>{ delete H[id]; if(t=='done'){ pickPath=d; $('refSel').value='pick'; if($('refText').value==SAMPLE_TEXT) $('refText').value=''; keepRef(); $('ttsSt').textContent='файл выбран'; } else $('ttsSt').textContent=d; }; F2.pick(id); };
async function ensureAI(st){ let j=await aiUp();
 if(j&&(j.ver||0)>=SRV_VER) return true;
 if(j&&j.busy){ st.textContent='сервер TTS/FLUX (старая версия) занят: '+j.busy+' - подождите или Система → Перезапустить'; return false; }
 st.textContent=j?'обновляю сервер TTS/FLUX…':'запускаю сервер TTS/FLUX в Debian…';
 const r=await sh(S+(j?'ai-restart':'ai-start'),l=>log(l)).catch(e=>({code:1,out:String(e)})); if(r.code){ st.textContent='не запустить: '+r.out; return false; }
 j=await waitUp(async()=>{const x=await aiUp(); return x&&(x.ver||0)>=SRV_VER?x:null;},90);
 if(j) return true; st.textContent='сервер не запустился - Система → Логи'; return false; }
const media=(el,name)=>new Promise(res=>{ // файл прямо с сервера по http; если WebView не пустит - через мост base64
 el.onload=el.oncanplay=()=>{el.onload=el.oncanplay=el.onerror=null; res(true);};
 el.onerror=async()=>{el.onload=el.oncanplay=el.onerror=null;
  try{const r=JSON.parse(await http('GET',AI+'/out/'+name,'','bin')); el.src='data:'+r['Content-Type']+';base64,'+r.b64; res(true);}catch(e){res(false);} };
 setTimeout(()=>res(false),15000); el.src=AI+'/out/'+name; });
let jobOn=false;
async function job(btn,xbtn,st,path,body,key,onOk){ if(jobOn){ st.textContent='уже идёт другая задача'; return; } jobOn=true; btn.disabled=true; const t0=Date.now(); let done=false;
 if(!localStorage.askedN){ localStorage.askedN=1; try{F2.askNotify();}catch(e){} }
 const usual=+localStorage[key]||0;
 try{ if(!await ensureAI(st)) return;
  xbtn.classList.remove('hide'); xbtn.disabled=false;
  xbtn.onclick=()=>{ xbtn.disabled=true; st.textContent='отмена…'; http('POST',AI+'/cancel','{}').catch(()=>{}); };
  st.textContent='запуск…'+(usual?' (обычно ~'+fmt(usual)+')':'');
  (async()=>{ while(!done){ await sleep(1500); const j=await aiUp(); if(!j||done) continue;
   const el=(Date.now()-t0)/1000, eta=j.eta!=null?j.eta:(usual?usual-el:null);
   st.textContent='идёт '+fmt(el)+(eta!=null&&eta>0?' · осталось ~'+fmt(eta):'')+'\n'+(j.progress||'')+(j.mem?'\nсвободно ОЗУ '+(j.mem/1024).toFixed(1)+' ГБ':''); } })();
  const r=JSON.parse(await http('POST',AI+path,JSON.stringify(Object.assign({ret:'json'},body)),'text')); done=true;
  const all=(Date.now()-t0)/1000; localStorage[key]=Math.round(all); await onOk(r,all);
  try{F2.notif('Fold2 AI', st.textContent.split('\n')[0]);}catch(e){}
 }catch(e){ done=true; const m=String(e); st.textContent=/отменено/.test(m)?'отменено':'ошибка: '+m; try{F2.notif('Fold2 AI', st.textContent.slice(0,80));}catch(x){} }
 finally{ done=true; jobOn=false; btn.disabled=false; xbtn.classList.add('hide'); } }
$('tts').onclick=()=>{ const st=$('ttsSt'), sel=$('refSel').value; let ref='';
 if(sel=='rec'){ if(!recPath){ st.textContent='сначала запишите голос'; return; } ref=toCh(recPath); }
 if(sel=='pick'){ if(!pickPath){ st.textContent='сначала выберите файл'; return; } ref=toCh(pickPath); }
 const text=$('ttsText').value.trim(); if(!text){ st.textContent='пустой текст'; return; }
 job($('tts'),$('ttsX'),st,'/tts',{text:text,language:$('lang').value,ref_audio:ref,ref_text:$('refText').value},'t_tts_'+Math.round(text.length/50),async(r,all)=>{
  st.textContent='готово: синтез '+(+r['X-Gen-Sec']).toFixed(1)+' с на '+(+r['X-Audio-Sec']).toFixed(1)+' с звука (всего '+all.toFixed(0)+' с, '+(r['X-Backend']||'?')+')\n'+r['X-File'];
  if(await media($('au'),r.name)) $('au').play().catch(()=>{}); recent(); }); };

// ---------- картинка
let lastSeed=null;
$('seedKeep').onclick=()=>{ if(lastSeed!=null){ $('seed').value=lastSeed; localStorage.f_seed=lastSeed; $('imgSt').textContent+='\nseed '+lastSeed+' закреплён (-1 - снова случайный)'; } };
$('gen').onclick=()=>{ const [w,h]=$('size').value.split('x').map(Number), steps=+$('steps').value||4, prompt=$('prompt').value.trim();
 if(!prompt){ $('imgSt').textContent='пустой запрос'; return; }
 job($('gen'),$('genX'),$('imgSt'),'/image',{prompt:prompt,w:w,h:h,steps:steps,seed:+$('seed').value},'t_img_'+w+'x'+h+'_'+steps,async(r)=>{
  lastSeed=r['X-Seed']; $('seedKeep').classList.remove('hide');
  $('imgSt').textContent='готово за '+fmt(+r['X-Gen-Sec'])+' · '+(r['X-Size']||'')+' · seed '+lastSeed+'\n'+r['X-File'];
  await media($('out'),r.name); recent(); }); };
// последние результаты (с сервера: /sdcard/models/out) - миниатюры картинок и список звука
async function recent(){ let l; try{ l=JSON.parse(await http('GET',AI+'/list')); }catch(e){ return; }
 const g=$('gal'); g.innerHTML=''; l.filter(f=>/^flux_.*\.png$/.test(f.name)).slice(0,12).forEach(f=>{ const i=document.createElement('img'); i.loading='lazy'; i.src=AI+'/out/'+f.name;
  i.onclick=()=>{ media($('out'),f.name); $('imgSt').textContent=f.name; $('out').scrollIntoView({block:'center'}); }; g.appendChild(i); });
 const a=$('aud'); a.innerHTML=''; l.filter(f=>/^tts_.*\.wav$/.test(f.name)).slice(0,6).forEach(f=>{ const d=document.createElement('div');
  d.textContent='▶ '+f.name.replace(/^tts_(\d{4})(\d\d)(\d\d)_(\d\d)(\d\d)(\d\d)\.wav$/,'$3.$2 $4:$5:$6')+' ('+Math.round(f.size/48000)+' с)';
  d.onclick=async()=>{ if(await media($('au'),f.name)) $('au').play().catch(()=>{}); }; a.appendChild(d); }); }
document.querySelectorAll('nav button[data-t=img],nav button[data-t=voice]').forEach(b=>b.addEventListener('click',async()=>{ if(!$('gal').childElementCount&&await aiUp()) recent(); }));

// ---------- система
$('stat').onclick=()=>status(true);
$('aiStart').onclick=()=>sh(S+'ai-start',log).catch(log);
$('aiStop').onclick=()=>sh(S+'ai-stop',log).catch(log);
$('aiRe').onclick=()=>{ log('перезапуск TTS/FLUX…'); sh(S+'ai-restart',log).catch(log); };
$('npuTest').onclick=()=>{ log('тест NPU…'); sh(S+'npu-test',log).then(r=>log('код '+r.code)).catch(log); };
$('logs').onclick=()=>sh(S+'logs',log).catch(log);
// образцы голоса, уже лежащие в папке приложения (после переустановки localStorage пуст)
sh('ls '+RDIR+'/ref_user.wav '+RDIR+'/ref_pick.audio 2>/dev/null').then(r=>r.out.split('\n').forEach(f=>{
 if(/ref_user\.wav$/.test(f)&&!recPath) recPath=DIR+'/ref_user.wav'; if(/ref_pick\.audio$/.test(f)&&!pickPath) pickPath=DIR+'/ref_pick.audio'; })).catch(()=>{});
status(false).then(async()=>{ if(await llmUp()) $('llmSt').textContent='модель уже запущена'; });
