# Настройки сборки. Любое изменение этого файла (commit в main) запускает новую сборку.
# DISPLAY_MODE: dual  - ядро с обоими экранами, внешний основной через displayconfig (план A)
#               cover - ядро «только внешний экран», msm_drm.f2q_cover_only=1 (план B)
DISPLAY_MODE=dual
# CAMERA_MASS: false - камера S22 (у стока Fold2 флагманская камера); true - камера r9q «mass», как у r8q
CAMERA_MASS=false
# UN1CA_REF: latest - свежий UN1CA (sixteen); tested - коммит 0c2ea1d6, на котором всё сверялось; или SHA
UN1CA_REF=latest
