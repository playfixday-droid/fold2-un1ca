<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fold2 Монитор</title>
<style>
:root{--fs:1;--rad:16px;--gap:10px;--rowh:92px;--op:1;--cols:4;--font:system-ui,Roboto,sans-serif;
--bg:#0b0f17;--bg2:#121a2b;--card:#141c2b;--text:#e6edf7;--muted:#8a97ad;--accent:#4fd1c5;--accent2:#7aa2ff;--good:#3ddc97;--warn:#f6c453;--bad:#ff6b6b;--grid:rgba(255,255,255,.07);--border:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:calc(14px*var(--fs));-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit}
svg.i{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none}
body.bganim #bg{background-size:200% 200%!important;animation:bgm 30s ease-in-out infinite alternate}
@keyframes bgm{from{background-position:0% 0%}to{background-position:100% 100%}}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
body.hcompact header{padding:.2rem .5rem}
body.hcompact .brand b{display:none}
body.hfloat header{position:fixed;top:auto;bottom:.8rem;right:.8rem;left:auto;border-radius:2rem;padding:.25rem;box-shadow:0 8px 30px rgba(0,0,0,.35);background:color-mix(in srgb,var(--card) 92%,transparent)}
body.hfloat .brand,body.hfloat #tabs{display:none}
.brand{display:flex;align-items:center;gap:.45rem;font-weight:700;white-space:nowrap}
.brand svg{width:1.5rem;height:1.5rem;color:var(--accent)}
.pill{font-size:.68rem;font-weight:700;padding:.15rem .5rem;border-radius:1rem;background:var(--grid);color:var(--muted);cursor:pointer}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 15%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
#tabs{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:.38rem .8rem;border-radius:2rem;border:0;background:transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.tab.on{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.ib{width:2.3rem;height:2.3rem;border-radius:.8rem;display:grid;place-items:center;background:transparent;border:0;cursor:pointer;flex:none}
.ib:hover,.ib:focus-visible{background:var(--grid)}
.ib.on{background:var(--accent);color:var(--bg)}
#editbar{position:sticky;top:3.3rem;z-index:19;display:none;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.45rem .7rem;margin:0 var(--gap);border-radius:var(--rad);background:color-mix(in srgb,var(--accent) 16%,var(--card));font-size:.85rem}
body.editing #editbar{display:flex}
#editbar .hint{color:var(--muted);flex:1;min-width:10rem}
.btn{background:var(--bg2);border:1px solid var(--border);border-radius:.7rem;padding:.45rem .8rem;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--bg);border-color:transparent;font-weight:700}
.btn.dng{color:var(--bad)}
.btn svg.i{width:1rem;height:1rem}
#wait{margin:var(--gap) var(--gap) 0;padding:.8rem 1rem;border-radius:var(--rad);background:color-mix(in srgb,var(--warn) 14%,var(--card));display:none;gap:.8rem;align-items:center;flex-wrap:wrap;font-size:.9rem}
#wait.on{display:flex}
#wait span{flex:1;min-width:12rem}
#grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:var(--rowh);gap:var(--gap);padding:var(--gap);padding-bottom:5rem;grid-auto-flow:row dense}
body.nodense #grid{grid-auto-flow:row}
#empty{display:none;margin:3rem auto;text-align:center;color:var(--muted);max-width:22rem;line-height:1.5}
#empty.on{display:block}
.wg{background:color-mix(in srgb,var(--card) calc(var(--op)*100%),transparent);border-radius:var(--rad);display:flex;flex-direction:column;overflow:hidden;position:relative;container-type:size;min-width:0}
body.border .wg{border:1px solid var(--border)}
body.shadow .wg{box-shadow:0 6px 22px rgba(0,0,0,.22)}
body.blur .wg{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.wg.clear{background:transparent;box-shadow:none!important;border-color:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.wh{display:flex;align-items:center;gap:.4rem;padding:.5rem .7rem .1rem;font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.05em;min-height:1.9rem}
body.upper .wh{text-transform:uppercase}
.wh .wt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh .wi{color:var(--accent);display:flex}
.wh .wi svg.i{width:1rem;height:1rem}
body.noicons .wh .wi{display:none}
.wh .wx{font-weight:600;color:var(--text);white-space:nowrap;letter-spacing:0;text-transform:none;font-size:.78rem}
.wg.notitle .wh{display:none}
body.notitles .wh{display:none}
body.editing .wg .wh{display:flex!important;cursor:grab;touch-action:none}
.wh button{display:none;border:0;background:var(--grid);border-radius:.5rem;width:1.7rem;height:1.7rem;place-items:center;cursor:pointer;color:var(--text)}
.wh .grip{display:none;color:var(--accent)}
body.editing .wh button,body.editing .wh .grip{display:grid}
body.editing .wg{outline:2px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-2px}
.rsz{display:none;position:absolute;right:0;bottom:0;width:1.8rem;height:1.8rem;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 52%,var(--accent) 52%);border-bottom-right-radius:var(--rad);opacity:.85;z-index:3}
body.editing .rsz{display:block}
.wsz{display:none;position:absolute;left:.6rem;bottom:.4rem;font-size:.7rem;color:var(--accent);font-weight:700;z-index:3}
body.editing .wsz{display:block}
.wg.dragging{opacity:.3}
.ghost{position:fixed!important;z-index:50;pointer-events:none;opacity:.92;transform:scale(1.03);box-shadow:0 18px 50px rgba(0,0,0,.5)!important}
.wg.flash{animation:fl 1s}
@keyframes fl{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 4px var(--accent)}}
.wb{flex:1;min-height:0;padding:.25rem .7rem .6rem;display:flex;flex-direction:column;gap:.38rem;overflow:hidden}
.wb.scroll{overflow:auto}
.big{font-size:2.1rem;font-weight:750;line-height:1;white-space:nowrap}
.big small{font-size:.9rem;font-weight:600;color:var(--muted);margin-left:.15rem}
.mid{font-size:1.25rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.78rem;color:var(--muted)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-size:.84rem;min-width:0}
.kv span{color:var(--muted);white-space:nowrap}
.kv b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.kvs{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.2rem .9rem}
.bar{height:.42rem;border-radius:1rem;background:var(--grid);overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .45s,background .45s}
.bar.thin{height:.28rem}
.ch{flex:1;min-height:28px;width:100%;display:block}
.row{display:flex;gap:.7rem;align-items:center;min-width:0}
.col{display:flex;flex-direction:column;gap:.22rem;min-width:0}
.grow{flex:1}
.ringbox{position:relative;width:5.4rem;height:5.4rem;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.rt{fill:none;stroke:var(--grid);stroke-width:9}
.rv{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .5s,stroke .5s}
.rc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05}
.rc b{font-size:1.45rem;font-weight:750}
.rc small{font-size:.68rem;color:var(--muted)}
.cores{display:flex;gap:3px;height:2.5rem;flex:none}
.cb{flex:1;height:100%;background:var(--grid);border-radius:5px;position:relative;overflow:hidden}
.cb i{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--accent);transition:height .45s,background .45s}
.cb span{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:.6rem;color:var(--text);opacity:.75;z-index:1}
.cb.off{opacity:.3}
.cb.iso{background:repeating-linear-gradient(45deg,var(--grid) 0 4px,transparent 4px 8px)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:.45rem;flex:1;min-height:0;overflow:auto;align-content:start}
.cc{background:var(--bg2);border-radius:calc(var(--rad)*.6);padding:.45rem .55rem;display:flex;flex-direction:column;gap:.15rem;min-height:5.6rem}
.cc canvas{height:2rem;width:100%;flex:1}
.cc .kv b{font-size:.95rem}
.lst{display:flex;flex-direction:column;gap:.38rem;overflow:auto;min-height:0;flex:1}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.12rem .6rem;align-items:center;font-size:.84rem}
.li>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li>b{font-weight:650;white-space:nowrap}
.li .bar{grid-column:1/-1}
.li .chip{margin-left:.3rem}
.chip{display:inline-block;font-size:.66rem;padding:.08rem .42rem;border-radius:1rem;background:var(--grid);color:var(--muted);font-weight:650;white-space:nowrap}
.chip.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.lg{display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:.76rem;flex:none}
.lg span{white-space:nowrap}
.lg i{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;margin-right:.3rem;vertical-align:middle}
.lg b{margin-left:.25rem}
table.tp{width:100%;border-collapse:collapse;font-size:.8rem}
table.tp td{padding:.18rem .2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
table.tp td:first-child{width:60%}
table.tp td:not(:first-child){text-align:right;width:20%}
table.tp tr:not(:last-child) td{border-bottom:1px solid var(--border)}
.clock{display:flex;flex-direction:column;justify-content:center;align-items:center;flex:1;text-align:center}
.clock b{font-size:min(30cqh,18cqw);font-weight:750;line-height:1;letter-spacing:-.02em}
.clock span{color:var(--muted);font-size:.85rem;margin-top:.3rem}
.note{flex:1;display:flex;align-items:center;white-space:pre-wrap;line-height:1.3}
.gauge{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.4rem;min-height:0}
.gauge .ringbox{width:min(70cqh,60cqw);height:min(70cqh,60cqw)}
.gauge .num{font-size:min(32cqh,22cqw);font-weight:750;line-height:1}
.dim{opacity:.55}
@container (max-height:150px){.ch,.h2{display:none!important}}
@container (max-height:112px){.h1{display:none!important}.ringbox{width:3.4rem;height:3.4rem}.rc b{font-size:1rem}.big{font-size:1.6rem}}
@container (max-width:230px){.ringbox{width:4.2rem;height:4.2rem}.rc b{font-size:1.1rem}.w2{display:none!important}.big{font-size:1.7rem}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:780px;max-height:92vh;border-radius:var(--rad) var(--rad) 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:var(--rad);max-height:88vh}}
.mh{display:flex;align-items:center;gap:.5rem;padding:.7rem 1rem;border-bottom:1px solid var(--border)}
.mh b{flex:1;font-size:1.05rem}
.mb{overflow:auto;padding:.4rem 1rem 1.4rem;-webkit-user-select:text;user-select:text}
.snav{display:flex;gap:.35rem;overflow-x:auto;padding:.6rem 1rem;border-bottom:1px solid var(--border);scrollbar-width:none;flex:none}
.snav::-webkit-scrollbar{display:none}
.snav button{border:0;background:var(--bg2);padding:.38rem .75rem;border-radius:2rem;white-space:nowrap;cursor:pointer;color:var(--muted);font-weight:600}
.snav button.on{background:var(--accent);color:var(--bg)}
h4{margin:1rem 0 .2rem;color:var(--accent);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.fr{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 0;border-bottom:1px solid var(--border);min-height:2.8rem}
.fr>span{flex:1;min-width:0}
.fr small{display:block;color:var(--muted);font-size:.74rem;margin-top:.1rem}
.fr b.v{color:var(--accent);margin-left:.3rem}
input[type=range]{width:44%;accent-color:var(--accent)}
select,input[type=text],input[type=number],textarea{background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:.6rem;padding:.42rem .6rem;font:inherit;max-width:60%}
textarea{width:100%;max-width:100%;min-height:7rem;font-family:monospace;font-size:.78rem}
input[type=color]{width:2.6rem;height:2rem;border:0;background:none;padding:0}
input.sw{appearance:none;-webkit-appearance:none;width:2.7rem;height:1.55rem;border-radius:1rem;background:var(--grid);position:relative;transition:.2s;flex:none;cursor:pointer;border:1px solid var(--border)}
input.sw:checked{background:var(--accent)}
input.sw::after{content:'';position:absolute;top:.15rem;left:.17rem;width:1.1rem;height:1.1rem;border-radius:50%;background:#fff;transition:.2s}
input.sw:checked::after{left:1.3rem}
input.cb2{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
.thg{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.4rem,1fr));gap:.55rem;margin:.5rem 0}
.th{border-radius:.9rem;padding:.45rem;border:2px solid var(--border);cursor:pointer;font-size:.8rem;font-weight:650}
.th.on{border-color:var(--accent)}
.th .pv{height:2.8rem;border-radius:.6rem;display:flex;align-items:flex-end;gap:4px;padding:6px;margin-bottom:.35rem}
.th .pv i{flex:1;border-radius:3px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.55rem;margin-top:.6rem}
.ci{display:flex;gap:.65rem;padding:.7rem;border-radius:.9rem;background:var(--bg2);cursor:pointer;border:1px solid var(--border);text-align:left;align-items:flex-start}
.ci:hover{border-color:var(--accent)}
.ci svg.i{color:var(--accent);margin-top:.1rem}
.ci small{display:block;color:var(--muted);font-size:.74rem;margin-top:.15rem;line-height:1.3}
.pg{display:flex;gap:.4rem;align-items:center;padding:.4rem 0;border-bottom:1px solid var(--border)}
.pg input{flex:1;max-width:none}
.sens{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.3rem .6rem;align-items:center;font-size:.82rem;margin-top:.5rem}
.sens input[type=text]{max-width:100%;width:100%;padding:.3rem .5rem}
.sens small{color:var(--muted);display:block;font-size:.7rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mute{color:var(--muted);font-size:.82rem;line-height:1.45}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,180%);visibility:hidden;background:var(--card);color:var(--text);padding:.6rem 1rem;border-radius:1rem;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:transform .3s,visibility .3s;z-index:90;border:1px solid var(--border);max-width:90vw}
.ctl{gap:.25rem}
.ctl .pr{gap:.4rem;margin:.1rem 0 .3rem}
.ctl .pr .btn{padding:.35rem .7rem}
.ctl h5{margin:.65rem 0 .1rem;font-size:.8rem;font-weight:700;color:var(--accent);display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.ctl h5 b{color:var(--text);font-size:.9rem}
.ctl .fr{padding:.3rem 0;min-height:2.2rem;font-size:.86rem}
.ctl select{max-width:58%}
.ctl .cpus{display:flex;gap:.35rem;flex-wrap:wrap;margin:.3rem 0}
.ctl .cpus label{display:flex;gap:.25rem;align-items:center;font-size:.82rem;background:var(--bg2);padding:.2rem .5rem;border-radius:.5rem}
.ctl details summary{cursor:pointer;color:var(--muted);font-size:.84rem;padding:.5rem 0}
.wbox{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:.7rem;padding:.5rem .6rem;font-size:.82rem;line-height:1.45}
#toast.on{transform:translate(-50%,0);visibility:visible}
@media (max-width:420px){.brand b{display:none}}
@container (max-width:200px){.row .col .kv{flex-direction:column;align-items:flex-start;gap:0;line-height:1.2}.row .col .kv span{font-size:.68rem}.row .col .kv b{text-align:left;max-width:100%}.mid{font-size:1rem}.row{gap:.45rem}.big{font-size:1.5rem}}
body.noanim *,body.noanim *::after{transition:none!important;animation:none!important}
</style>

<body class="border shadow upper">
<div id="bg"></div>
<header>
  <div class="brand"><svg class="i" viewBox="0 0 24 24"><path d="M2 12h4l3-7 5 14 3-7h5"/></svg><b>Монитор</b><span id="rootst" class="pill">…</span></div>
  <nav id="tabs"></nav>
  <button class="ib" id="bCtl" title="Управление CPU/GPU (C)"></button>
  <button class="ib" id="bEdit" title="Расставить виджеты (E)"></button>
  <button class="ib" id="bSet" title="Настройки (S)"></button>
</header>
<div id="editbar">
  <button class="btn pri" id="bAdd"></button>
  <button class="btn" id="bPages"></button>

  <button class="btn pri" id="bDone">Готово</button>
</div>
<div id="wait"><span id="waitt">Жду данные…</span><button class="btn" id="bRoot">Запросить root снова</button></div>
<main id="grid"></main>

<div id="modal"><div class="sheet"><div class="mh"><b id="mt"></b><button class="ib" id="mx"></button></div><div id="mnav" class="snav" hidden></div><div class="mb" id="mb"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
const B = window.F2M || null;

const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fin = v => typeof v === 'number' && isFinite(v);
const mx = a => { let m = NaN; for (const v of a) if (fin(v) && !(m >= v)) m = v; return m; };

// ---------- иконки ----------
const IP = {
  cpu: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  cores: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  gpu: '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="9" cy="12" r="3"/><path d="M15 10h3M15 14h3"/>',
  npu: '<circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5 5l2.5 2.5M16.5 16.5 19 19M5 19l2.5-2.5M16.5 7.5 19 5"/>',
  ram: '<rect x="3" y="6" width="18" height="10" rx="1.5"/><path d="M7 10v2M11 10v2M15 10v2M6 16v3M10 16v3M14 16v3M18 16v3"/>',
  disk: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  bat: '<rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 11v2M6 10v4M10 10v4"/>',

// ---------- статус ----------
const T0 = Date.now(); let noRootHide = false;
function statusUI() {
  const p = $('#rootst'), w = $('#wait'), age = Date.now() - lastAt;
  let txt = '…', cls = 'pill', msg = '';

  else if (D.err) { txt = 'ошибка'; cls += ' bad'; msg = 'Сборщик не ответил — перезапускаю. Если повторяется, нажмите «Запросить root снова».'; }
  else if (age > Math.max(6000, S.interval * 4)) { txt = 'пауза'; cls += ' warn'; msg = 'Данные давно не обновлялись…'; }
  else if (D.root) { txt = B ? 'root' : 'демо'; cls += ' ok'; }
  else { txt = 'без root'; cls += ' warn'; if (!noRootHide) msg = 'Работаю без root: частоты, шины и часть датчиков недоступны. Magisk → Суперпользователь → разрешите «Fold2 Монитор».'; }

  if (act) t.querySelector('button').onclick = () => { t.classList.remove('on'); fn && fn(); };
  t.classList.add('on'); clearTimeout(toT); toT = setTimeout(() => t.classList.remove('on'), act ? 6000 : 2600);

// ---------- назад, клавиши, свайпы ----------
window.onBack = () => { if (MOD || $('#modal').classList.contains('on')) { closeModal(); return true; } if (EDIT) { setEdit(false); return true; } return false; };
addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!window.onBack()) return; e.preventDefault(); return; }
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('#modal').classList.contains('on')) return;
  const k = e.key.toLowerCase();
  if (k === 'e' || k === 'у') setEdit(!EDIT);
  else if (k === 's' || k === 'ы') settings();
  else if (k === 'a' || k === 'ф') catalog();
  else if (k === 'c' || k === 'с') ctlSheet();
  else if (e.key === 'ArrowRight') go(L.cur + 1);
  else if (e.key === 'ArrowLeft') go(L.cur - 1);
